name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Verify bundled examples after checkout
        run: |
          python scripts/review.py verify examples/halfyear-demo
          python scripts/review.py verify examples/summary-only
          python scripts/review.py verify examples/evidence-only
      - name: Standard-library summary and evidence
        run: |
          python -S scripts/create_light_demo.py "$RUNNER_TEMP/prs-smoke" --outputs summary,evidence
          python -S scripts/review.py build "$RUNNER_TEMP/prs-smoke"
          python -S scripts/review.py verify "$RUNNER_TEMP/prs-smoke"
      - name: Environment check for lightweight output
        run: python -S scripts/review.py doctor --outputs summary,evidence
